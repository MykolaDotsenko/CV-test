name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html resume.html

      - name: Validate local links
        run: python scripts/check_local_links.py

      - name: Compile validation script
        run: python -m compileall -q scripts
